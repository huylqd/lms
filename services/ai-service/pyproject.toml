[project]
name = "lms-ai-service"
version = "0.1.0"
description = "Internal AI tutor/feedback service for the LMS (called only by core-api)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165,<0.166",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
