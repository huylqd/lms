failure-threshold: error

override:
  error:
    - DL3002 # last USER should not be root
    - DL3004 # do not use sudo
    - DL3007 # do not use the :latest tag for base images
    - DL3020 # use COPY instead of ADD for files

ignored:
  - DL3008 # pin apt package versions (too noisy for small projects)
  - DL3018 # pin apk package versions
