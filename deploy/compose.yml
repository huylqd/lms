# Production/staging stack. Images for core-api, ai-service and web come from images.env
# (written by deploy.sh). Secrets/config come from app.env. For local builds add compose.dev.yml.
#
#   docker compose --env-file app.env --env-file images.env -p lms up -d
name: lms

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.9-alpine
    ports:
      - "${HTTP_PORT:-8880}:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      - web
      - core-api
      - keycloak

  postgres:
    <<: *hardening
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in app.env}
      LMS_DB_PASSWORD: ${LMS_DB_PASSWORD:?set LMS_DB_PASSWORD in app.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in app.env}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  keycloak:
    <<: *hardening
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: ${PUBLIC_URL:?set PUBLIC_URL in app.env}/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in app.env}
      # Placeholders used by keycloak/realm-lms.json
      PUBLIC_URL: ${PUBLIC_URL}
      LMS_WEB_CLIENT_SECRET: ${LMS_WEB_CLIENT_SECRET:?set LMS_WEB_CLIENT_SECRET in app.env}
    volumes:
      - ./keycloak/realm-lms.json:/opt/keycloak/data/import/realm-lms.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /idp/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    <<: *hardening
    image: ${CORE_API_IMAGE:-lms-core-api:dev}
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://lms:${LMS_DB_PASSWORD}@postgres:5432/lms?sslmode=disable
      OIDC_ISSUER: ${PUBLIC_URL}/idp/realms/lms
      OIDC_JWKS_URL: http://keycloak:8080/idp/realms/lms/protocol/openid-connect/certs
      OIDC_AUDIENCE: lms-api
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in app.env}
      EVIDENCE_DIR: /data/evidence
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - evidence_data:/data/evidence
    read_only: true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    <<: *hardening
    image: ${AI_SERVICE_IMAGE:-lms-ai-service:dev}
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]

  web:
    <<: *hardening
    image: ${WEB_IMAGE:-lms-web:dev}
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      OIDC_ISSUER: ${PUBLIC_URL}/idp/realms/lms
      OIDC_INTERNAL_URL: http://keycloak:8080/idp/realms/lms
      OIDC_CLIENT_ID: lms-web
      OIDC_CLIENT_SECRET: ${LMS_WEB_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in app.env}
      CORE_API_URL: http://core-api:8080
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]

volumes:
  pg_data:
  evidence_data:
  caddy_data:
  caddy_config:
